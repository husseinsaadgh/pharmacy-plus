والأوعية","en":"Cardiovascular system","icon":"❤️","color":"rose","desc":"الضغط، الذبحة، قصور القلب، اضطرابات النظم والدهون.","topics":["Hypertension","Heart failure","Antianginals","Lipid lowering"]},{"id":"D","name":"الأدوية الجلدية","en":"Dermatologicals","icon":"🧴","color":"purple","desc":"حب الشباب، الأكزيما، الفطريات، الالتهاب والمطهرات الجلدية.","topics":["Acne","Eczema","Fungal skin disease","Topical steroids"]},{"id":"G","name":"الجهاز البولي والتناسلي والهرمونات الجنسية","en":"Genito-urinary system & sex hormones","icon":"🧪","color":"indigo","desc":"المسالك البولية، البروستات، موانع الحمل والهرمونات الجنسية.","topics":["BPH","Overactive bladder","Contraception","ED"]},{"id":"H","name":"المستحضرات الهرمونية الجهازية","en":"Systemic hormonal preparations","icon":"🔬","color":"amber","desc":"الغدة الدرقية، الكورتيكوستيرويدات والهرمونات الجهازية.","topics":["Thyroid","Corticosteroids","Pituitary","Bone metabolism"]},{"id":"J","name":"مضادات العدوى الجهازية","en":"Antiinfectives for systemic use","icon":"🦠","color":"blue","desc":"المضادات الحيوية والفيروسية والفطرية والسل وغيرها.","topics":["β-lactams","Macrolides","Antivirals","Antifungals"]},{"id":"L","name":"مضادات الأورام والمعدلات المناعية","en":"Antineoplastic & immunomodulating agents","icon":"🎯","color":"orange","desc":"العلاج الكيميائي، العلاجات الموجهة والمعدلات المناعية.","topics":["Cytotoxics","Targeted therapy","Immunotherapy","Supportive care"]},{"id":"M","name":"الجهاز العضلي الهيكلي","en":"Musculo-skeletal system","icon":"🦴","color":"cyan","desc":"المسكنات، NSAIDs، النقرس وهشاشة العظام.","topics":["NSAIDs","Gout","Osteoporosis","Muscle relaxants"]},{"id":"N","name":"الجهاز العصبي","en":"Nervous system","icon":"🧠","color":"violet","desc":"المسكنات، الصرع، الاكتئاب، الذهان، باركنسون والصداع.","topics":["Analgesics","Antidepressants","Antiepileptics","Antipsychotics"]},{"id":"P","name":"مضادات الطفيليات ومبيدات الحشرات","en":"Antiparasitic products","icon":"🪱","color":"green","desc":"الديدان، الجرب، القمل والملاريا والطفيليات المختلفة.","topics":["Helminths","Scabies & lice","Antimalarials","Protozoa"]},{"id":"R","name":"الجهاز التنفسي","en":"Respiratory system","icon":"🫁","color":"sky","desc":"الربو، COPD، الحساسية، السعال والاحتقان.","topics":["Asthma","COPD","Allergic rhinitis","Cough"]},{"id":"S","name":"أعضاء الحس","en":"Sensory organs","icon":"👁️","color":"pink","desc":"أدوية العين والأذن ومضادات الالتهاب والعدوى الموضعية.","topics":["Glaucoma","Dry eye","Ophthalmic infection","Otics"]},{"id":"V","name":"متفرقات","en":"Various","icon":"🧰","color":"slate","desc":"مطهرات، مضادات سموم، مستحضرات تشخيصية وغيرها.","topics":["Antidotes","Antiseptics","Contrast media","Miscellaneous"]}],"drugs":[{"id":"omeprazole","name":"Omeprazole","ar":"أوميبرازول","system":"A","class":"Proton pump inhibitor","route":"PO / IV","atc":"A02BC01","level":"Beginner","uses":"خفض إفراز حمض المعدة في الاستطبابات المناسبة مثل GERD والقرحة وبعض أنظمة H. pylori.","moa":"يثبط H+/K+-ATPase في الخلايا الجدارية للمعدة بشكل غير عكوس، فيقل إفراز الحمض.","adr":"صداع، اضطرابات هضمية؛ مع الاستعمال الطويل قد تظهر مشكلات مرتبطة بنقص بعض المغذيات أو المغنيسيوم حسب الحالة.","contra":"فرط الحساسية وبعض التداخلات الدوائية؛ راجع المنتج وحالة المريض.","counsel":"عادةً يؤخذ قبل الطعام. لا تستخدمه طويلًا دون مراجعة الحاجة.","monitor":"الاستجابة، الأعراض المنذرة، والحاجة المستمرة للعلاج.","pearls":"الـPPI أقوى في كبح الحمض من H2 blockers.","tags":["GERD","PPI","Ulcer"]},{"id":"metformin","name":"Metformin","ar":"ميتفورمين","system":"A","class":"Biguanide","route":"PO","atc":"A10BA02","level":"Beginner","uses":"دواء أساسي شائع للسكري النوع الثاني عند المرضى المناسبين.","moa":"يقلل إنتاج الغلوكوز الكبدي ويحسن حساسية الإنسولين.","adr":"غثيان، إسهال، انزعاج بطني؛ الحماض اللبني نادر لكنه خطير في سياقات محددة.","contra":"تقييم وظيفة الكلية ضروري؛ توجد موانع واحتياطات مرتبطة بالحالات الحادة والقصور الكلوي.","counsel":"تناوله مع الطعام يحسن التحمل. لا تستخدمه اعتمادًا على قيمة سكر واحدة.","monitor":"eGFR، HbA1c/سكر الدم، التحمل الهضمي، وB12 عند وجود عوامل خطورة.","pearls":"خطر نقص السكر أقل عند استخدامه منفردًا مقارنةً بمحفزات الإنسولين.","tags":["Diabetes","T2DM"]},{"id":"ondansetron","name":"Ondansetron","ar":"أوندانسيترون","system":"A","class":"5-HT3 receptor antagonist","route":"PO / IV","atc":"A04AA01","level":"Intermediate","uses":"الوقاية/العلاج من الغثيان والقيء في سياقات سريرية محددة.","moa":"يحصر مستقبلات 5-HT3 المحيطية والمركزية.","adr":"صداع، إمساك؛ قد يطيل QT لدى بعض المرضى.","contra":"فرط الحساسية؛ الحذر مع أدوية/حالات تزيد QT.","counsel":"لا تعالج السبب الأساسي للقيء؛ استخدم حسب الاستطباب.","monitor":"الأعراض، الترطيب، وعوامل خطر QT.","pearls":"فكر بخطر إطالة QT عند اجتماع عوامل خطورة.","tags":["Nausea","Vomiting"]},{"id":"loperamide","name":"Loperamide","ar":"لوبيراميد","system":"A","class":"Peripheral opioid receptor agonist","route":"PO","atc":"A07DA03","level":"Beginner","uses":"تقليل الإسهال الحاد غير المعقد في البالغين وبعض الاستطبابات الأخرى.","moa":"يقلل حركة الأمعاء وإفراز السوائل عبر مستقبلات أفيونية محيطية.","adr":"إمساك، مغص؛ الجرعات المفرطة قد ترتبط باضطرابات نظم خطرة.","contra":"لا يستخدم عند وجود إسهال دموي/حمى أو اشتباه عدوى غازية إلا بتقييم مناسب.","counsel":"السوائل وتعويض الأملاح مهمان. لا تتجاوز المدة/الجرعة الموصى بها.","monitor":"الترطيب، علامات العدوى، واستمرار الإسهال.","pearls":"مضاد الإسهال ليس مناسبًا لكل إسهال.","tags":["Diarrhea"]},{"id":"warfarin","name":"Warfarin","ar":"وارفارين","system":"B","class":"Vitamin K antagonist","route":"PO","atc":"B01AA03","level":"Advanced","uses":"مضاد تخثر في استطبابات محددة مثل بعض حالات AF وVTE والصمامات الميكانيكية.","moa":"يثبط VKORC1 ويقلل تصنيع عوامل التخثر المعتمدة على فيتامين K.","adr":"النزف أهم خطر؛ نادرًا مضاعفات أخرى مثل النخر الجلدي.","contra":"نزف فعال وموانع مرتبطة بالحمل واستطباب المريض والتداخلات.","counsel":"ثبات نمط الغذاء مهم، خصوصًا مدخول فيتامين K. يجب الالتزام بفحوص INR.","monitor":"INR، النزف، التداخلات، وتغيرات النظام الغذائي/الدوائي.","pearls":"Warfarin دواء يحتاج titration ومتابعة وليس جرعة ثابتة.","tags":["Anticoagulant","INR"]},{"id":"clopidogrel","name":"Clopidogrel","ar":"كلوبيدوغريل","system":"B","class":"P2Y12 inhibitor","route":"PO","atc":"B01AC04","level":"Intermediate","uses":"منع الأحداث الخثرية الشريانية في استطبابات مناسبة مثل ACS وبعض المرضى بعد PCI.","moa":"يثبط مستقبل P2Y12 للـADP على الصفائح بشكل غير عكوس.","adr":"نزف، كدمات؛ نادرًا نقص صفائح/مشكلات دموية.","contra":"نزف فعال وموانع أخرى حسب المنتج والاستطباب.","counsel":"لا توقفه ذاتيًا بعد تركيب دعامة أو ضمن خطة DAPT.","monitor":"علامات النزف، الالتزام، والتداخلات.","pearls":"هو prodrug ويتأثر استقلابه بـCYP2C19.","tags":["Antiplatelet","P2Y12"]},{"id":"ferrous-sulfate","name":"Ferrous sulfate","ar":"كبريتات الحديد","system":"B","class":"Oral iron","route":"PO","atc":"B03AA07","level":"Beginner","uses":"علاج نقص الحديد عندما يكون العلاج الفموي مناسبًا.","moa":"يوفر الحديد لتكوين الهيموغلوبين وتصحيح مخزون الحديد تدريجيًا.","adr":"غثيان، إمساك، براز داكن.","contra":"لا تعالج فقر الدم مجهول السبب قبل تقييم السبب.","counsel":"قد يحسن أخذه بعيدًا عن بعض الأطعمة/الأدوية الامتصاص، لكن التحمل مهم.","monitor":"Hb، ferritin/iron studies بحسب الحالة، والتحمل والالتزام.","pearls":"تحسن Hb يسبق استعادة مخزون الحديد؛ أكمل العلاج حسب الخطة.","tags":["Anemia","Iron"]},{"id":"amlodipine","name":"Amlodipine","ar":"أملوديبين","system":"C","class":"Dihydropyridine calcium-channel blocker","route":"PO","atc":"C08CA01","level":"Beginner","uses":"ارتفاع ضغط الدم والذبحة الصدرية في المرضى المناسبين.","moa":"يثبط قنوات الكالسيوم من نوع L في العضلات الملساء الوعائية فيسبب توسعًا وعائيًا.","adr":"وذمة طرفية، صداع، احمرار، دوخة.","contra":"الحذر في بعض الحالات القلبية والضغطية؛ راجع الموانع الفردية.","counsel":"دواء يومي طويل الأمد؛ لا توقفه عند تحسن القراءة فقط.","monitor":"ضغط الدم، الوذمة، الدوخة والاستجابة.","pearls":"الوذمة الطرفية شائعة ولا تعني وحدها فشل القلب.","tags":["Hypertension","CCB"]},{"id":"losartan","name":"Losartan","ar":"لوسارتان","system":"C","class":"Angiotensin II receptor blocker","route":"PO","atc":"C09CA01","level":"Intermediate","uses":"ارتفاع ضغط الدم واستطبابات أخرى مثل بعض مرضى قصور القلب/اعتلال الكلية.","moa":"يحصر مستقبل AT1 للأنجيوتنسين II، فيقل التضيق الوعائي والألدوستيرون.","adr":"دوخة، ارتفاع بوتاسيوم، تغيرات وظيفة الكلية.","contra":"الحمل؛ الحذر مع تضيق الشرايين الكلوية وبعض الحالات الأخرى.","counsel":"لا تتناول مكملات البوتاسيوم دون استشارة.","monitor":"ضغط الدم، K+، creatinine/eGFR.","pearls":"ARBs لا تسبب السعال الجاف بنفس معدل ACE inhibitors.","tags":["ARB","Hypertension"]},{"id":"atorvastatin","name":"Atorvastatin","ar":"أتورفاستاتين","system":"C","class":"HMG-CoA reductase inhibitor","route":"PO","atc":"C10AA05","level":"Intermediate","uses":"خفض LDL وتقليل الخطر القلبي الوعائي حسب مستوى الخطورة.","moa":"يثبط HMG-CoA reductase ويزيد التقاط LDL في الكبد.","adr":"ألم عضلي، ارتفاع إنزيمات الكبد؛ اعتلال عضلي شديد نادر.","contra":"الحمل وبعض الحالات/التداخلات؛ راجع المنتج.","counsel":"أبلغ عن ألم عضلي شديد أو غير معتاد، وتحقق من التداخلات.","monitor":"Lipid panel، الأعراض العضلية ووظائف الكبد عند الحاجة السريرية.","pearls":"اختيار شدة الستاتين يعتمد على خطر المريض والهدف وليس رقمًا منفردًا.","tags":["Statin","Lipid"]},{"id":"furosemide","name":"Furosemide","ar":"فوروسيميد","system":"C","class":"Loop diuretic","route":"PO / IV","atc":"C03CA01","level":"Intermediate","uses":"الوذمة المرتبطة بقصور القلب وحالات أخرى، وبعض الاستعمالات في الضغط.","moa":"يثبط NKCC2 في الثلث الصاعد الغليظ من عروة Henle.","adr":"نقص K+/Na+، جفاف، انخفاض ضغط؛ سمية أذنية في ظروف معينة.","contra":"موانع مرتبطة بالجفاف الشديد واضطرابات الأملاح وبعض الحالات.","counsel":"راقب السوائل والدوخة. توقيت الجرعة يؤثر على التبول.","monitor":"الوزن، الضغط، Na/K/creatinine، الحالة الحجمية.","pearls":"راقب electrolytes والوظيفة الكلوية خصوصًا مع الجرعات الأعلى.","tags":["Diuretic","Edema"]},{"id":"hydrocortisone","name":"Hydrocortisone topical","ar":"هيدروكورتيزون موضعي","system":"D","class":"Low-potency topical corticosteroid","route":"Topical","atc":"D07AA02","level":"Beginner","uses":"أمراض التهابية جلدية خفيفة مناسبة للعلاج الموضعي.","moa":"يثبط وسائط الالتهاب والمناعة محليًا.","adr":"ضمور الجلد مع الإفراط/الطول، تفاقم عدوى فطرية محتملة.","contra":"لا يوضع عشوائيًا على عدوى غير معالجة أو قرب العين دون توجيه.","counsel":"طبقة رقيقة ومدة مناسبة؛ تجنب الاستخدام المفرط.","monitor":"التحسن، تهيج الجلد، وظهور علامات عدوى.","pearls":"قوة الستيرويد وموضع الجسم ومدة الاستخدام مهمة.","tags":["Eczema","Steroid"]},{"id":"clotrimazole","name":"Clotrimazole","ar":"كلوتريمازول","system":"D","class":"Imidazole antifungal","route":"Topical","atc":"D01AC01","level":"Beginner","uses":"عدوى فطرية سطحية مناسبة لمضادات الفطريات الموضعية.","moa":"يقلل تصنيع ergosterol الفطري عبر تثبيط 14-α-demethylase.","adr":"تهيج موضعي، حرقان أو احمرار.","contra":"فرط الحساسية؛ لا تستخدمه لأي طفح دون تشخيص مناسب.","counsel":"الالتزام بمدة العلاج مهم حتى بعد تحسن الأعراض بحسب المنتج.","monitor":"الاستجابة والتهيج.","pearls":"المظهر وحده لا يكفي دائمًا لتمييز الفطريات عن الإكزيما.","tags":["Fungal","Topical"]},{"id":"tretinoin","name":"Tretinoin topical","ar":"تريتينوين موضعي","system":"D","class":"Topical retinoid","route":"Topical","atc":"D10AD01","level":"Intermediate","uses":"علاج حب الشباب وبعض الاستطبابات الجلدية المحددة.","moa":"ينظم تمايز الخلايا الكيراتينية ويقلل تشكل الكوميدونات.","adr":"جفاف، تقشر، تهيج وحساسية للشمس.","contra":"الحمل يتطلب مراجعة/تجنب حسب المنتج والسياق؛ تجنب المناطق المتهيجة بشدة.","counsel":"يبدأ تدريجيًا، مع واقٍ شمسي وترطيب مناسب.","monitor":"التهيج والاستجابة خلال أسابيع.","pearls":"قد يسوء حب الشباب ظاهريًا في البداية قبل التحسن.","tags":["Acne","Retinoid"]},{"id":"tamsulosin","name":"Tamsulosin","ar":"تامسولوسين","system":"G","class":"Alpha-1 blocker","route":"PO","atc":"G04CA02","level":"Intermediate","uses":"أعراض تضخم البروستات الحميد.","moa":"يحصر مستقبلات α1A في العضلات الملساء للبروستات وعنق المثانة.","adr":"دوخة، انخفاض ضغط وضعي، اضطراب القذف؛ متلازمة iris floppy أثناء بعض جراحات العين.","contra":"الحذر مع انخفاض الضغط ومشاركة أدوية موسعة للأوعية.","counsel":"النهوض ببطء؛ أخبر طبيب العيون قبل جراحة الساد.","monitor":"الأعراض البولية والدوخة والضغط.","pearls":"يحسن الأعراض لكنه لا يصغر البروستات بحد ذاته.","tags":["BPH","Alpha blocker"]},{"id":"sildenafil","name":"Sildenafil","ar":"سيلدينافيل","system":"G","class":"PDE-5 inhibitor","route":"PO","atc":"G04BE03","level":"Intermediate","uses":"ضعف الانتصاب وبعض الاستطبابات الرئوية بمنتجات/جرعات مختلفة.","moa":"يثبط PDE-5 ويرفع cGMP في العضلات الملساء، مع تحسين الاستجابة للـNO.","adr":"صداع، احمرار، عسر هضم، تغيرات بصرية عابرة.","contra":"ممنوع مع النترات؛ الحذر مع خافضات الضغط وبعض الحالات القلبية.","counsel":"لا يجمع مع nitrates. يحتاج إثارة جنسية لتحقيق التأثير في ED.","monitor":"الضغط، الفعالية والآثار الجانبية.","pearls":"أهم سؤال دوائي قبل الصرف: هل يستخدم nitrate؟","tags":["ED","PDE5"]},{"id":"levothyroxine","name":"Levothyroxine","ar":"ليفوثيروكسين","system":"H","class":"Thyroid hormone","route":"PO / IV","atc":"H03AA01","level":"Intermediate","uses":"قصور الغدة الدرقية واستطبابات درقية محددة.","moa":"يعوض T4 ويؤدي إلى تأثيرات درقية بعد تحويل جزء منه إلى T3 محيطيًا.","adr":"الزيادة قد تسبب خفقانًا، رجفة، تعرقًا وأرقًا.","contra":"تقييم الجرعة مهم خصوصًا في كبار السن ومرضى القلب.","counsel":"الثبات في التوقيت وطريقة التناول مهم؛ الحديد والكالسيوم قد يقللان الامتصاص.","monitor":"TSH/FT4 وفق الخطة السريرية.","pearls":"التبدل بين المنتجات/طرق تناولها قد يغير TSH لدى بعض المرضى.","tags":["Thyroid","T4"]},{"id":"prednisolone","name":"Prednisolone","ar":"بريدنيزولون","system":"H","class":"Systemic corticosteroid","route":"PO","atc":"H02AB06","level":"Intermediate","uses":"أمراض التهابية ومناعية متعددة بحسب التشخيص.","moa":"ينشط مستقبلات glucocorticoid وينظم التعبير الجيني لمجموعة واسعة من وسائط الالتهاب.","adr":"ارتفاع السكر والضغط، احتباس سوائل، اضطرابات مزاج ونقص مناعة مع الاستخدام الأطول.","contra":"تعتمد على الجرعة والمدة والعدوى والحالة؛ لا يوقف بعد الاستخدام المزمن فجأة.","counsel":"تناوله حسب الخطة ولا توقفه عشوائيًا بعد الاستخدام المطول.","monitor":"السكر، الضغط، العدوى، الوزن والعظام وفق المدة.","pearls":"الجرعة والمدة يغيران مخاطر الستيرويد بصورة كبيرة.","tags":["Steroid","Inflammation"]},{"id":"amoxicillin","name":"Amoxicillin","ar":"أموكسيسيلين","system":"J","class":"Aminopenicillin β-lactam","route":"PO","atc":"J01CA04","level":"Beginner","uses":"عدوى بكتيرية حساسة وفق موقع العدوى والممرض والإرشادات المحلية.","moa":"يثبط تصنيع جدار الخلية بالارتباط مع PBPs.","adr":"إسهال، غثيان، طفح؛ التحسس قد يكون شديدًا.","contra":"حساسية شديدة سابقة للبنسلينات/بعض β-lactams حسب نوع التفاعل.","counsel":"لا يُستخدم للعدوى الفيروسية. التزم بالوصفة، وراقب الإسهال الشديد.","monitor":"الاستجابة، الحساسية، الإسهال، والوظيفة الكلوية عند الحاجة.","pearls":"اسأل عن طبيعة حساسية البنسلين، لا تكتفِ بكلمة “حساسية”.","tags":["Antibiotic","Penicillin"]},{"id":"azithromycin","name":"Azithromycin","ar":"أزيثروميسين","system":"J","class":"Macrolide","route":"PO / IV","atc":"J01FA10","level":"Intermediate","uses":"عدوى بكتيرية مختارة وحسب الإرشادات والمقاومة المحلية.","moa":"يرتبط بالوحدة 50S الريبوسومية ويثبط تصنيع البروتين.","adr":"اضطرابات هضمية؛ قد يطيل QT لدى بعض المرضى.","contra":"الحذر مع تاريخ اضطراب نظم/إطالة QT والتداخلات المناسبة.","counsel":"لا تستخدمه لمجرد التهاب الحلق دون تقييم السبب.","monitor":"الاستجابة، الأعراض الهضمية وعوامل خطر QT.","pearls":"المقاومة والاستخدام غير المناسب للمضادات مشكلة علاجية حقيقية.","tags":["Macrolide","Antibiotic"]},{"id":"fluconazole","name":"Fluconazole","ar":"فلوكونازول","system":"J","class":"Triazole antifungal","route":"PO / IV","atc":"J02AC01","level":"Intermediate","uses":"عدوى فطرية مناسبة حسب الممرض والموقع.","moa":"يثبط تصنيع ergosterol الفطري عبر CYP51/14-α-demethylase.","adr":"غثيان، ارتفاع إنزيمات الكبد، وتداخلات دوائية متعددة.","contra":"تداخلات مهمة وبعض حالات QT/الكبد؛ راجع المنتج.","counsel":"الالتزام بالمدة والتحقق من التداخلات مهم.","monitor":"الاستجابة، وظائف الكبد عند الحاجة، والتداخلات.","pearls":"Fluconazole inhibitor دوائي مهم لبعض CYPs.","tags":["Antifungal","Azole"]},{"id":"acyclovir","name":"Acyclovir","ar":"أسيكلوفير","system":"J","class":"Antiviral","route":"PO / IV / Topical","atc":"J05AB01","level":"Intermediate","uses":"عدوى HSV وVZV في سياقات علاجية مناسبة.","moa":"نظير نوكليوزيدي يُفعّل في الخلايا المصابة ويثبط DNA polymerase الفيروسي.","adr":"غثيان؛ سمية كلوية خاصة مع IV/الجفاف في سياقات معينة.","contra":"الحذر مع القصور الكلوي والجفاف.","counsel":"البدء المبكر قد يفيد في بعض العدوى؛ اشرب سوائل مناسبة حسب حالتك.","monitor":"وظيفة الكلية والاستجابة والجرعة حسب eGFR.","pearls":"التحويل من جرعة ثابتة إلى renal-adjusted dosing مهم في القصور الكلوي.","tags":["Antiviral","HSV"]},{"id":"ibuprofen","name":"Ibuprofen","ar":"إيبوبروفين","system":"M","class":"NSAID","route":"PO","atc":"M01AE01","level":"Beginner","uses":"الألم والالتهاب والحمى عند المريض المناسب.","moa":"يثبط COX ويقلل تصنيع البروستاغلاندينات.","adr":"عسر هضم، قرحة/نزف، تأثيرات كلوية، احتباس سوائل.","contra":"القرحة/النزف، بعض حالات الكلية والقلب والحمل المتأخر وغيرها.","counsel":"تجنب الجمع العشوائي بين NSAIDs، وانتبه للتجفاف.","monitor":"الألم، الضغط، النزف ووظائف الكلية عند الاستخدام المطول.","pearls":"أقل جرعة فعالة لأقصر مدة مناسبة.","tags":["NSAID","Analgesic"]},{"id":"allopurinol","name":"Allopurinol","ar":"ألوبورينول","system":"M","class":"Xanthine oxidase inhibitor","route":"PO","atc":"M04AA01","level":"Intermediate","uses":"خفض اليورات في النقرس وفرط حمض اليوريك في الاستطبابات المناسبة.","moa":"يثبط xanthine oxidase ويقلل إنتاج حمض اليوريك.","adr":"طفح؛ نادرًا hypersensitivity syndrome شديد.","contra":"الحذر الشديد عند بدء العلاج ومع بعض العوامل الجينية/الكلوية.","counsel":"لا تستخدمه لعلاج نوبة الألم الحادة كمسكن؛ بدء العلاج يحتاج خطة مناسبة.","monitor":"Serum urate، الكلية، الطفح والالتزام.","pearls":"الهدف عادة هو urate target-based وليس مجرد إزالة الألم.","tags":["Gout","Urate"]},{"id":"alendronate","name":"Alendronate","ar":"أليندرونات","system":"M","class":"Bisphosphonate","route":"PO","atc":"M05BA04","level":"Intermediate","uses":"علاج/وقاية هشاشة العظام في المرضى المناسبين.","moa":"يثبط نشاط osteoclast ويقلل ارتشاف العظم.","adr":"تهيج مريئي واضطرابات هضمية؛ مخاطر نادرة مع الاستخدام الطويل.","contra":"مشكلات مريئية معينة وعدم القدرة على الوقوف/الجلوس بعد الجرعة، وغيرها.","counsel":"يؤخذ صباحًا مع ماء فقط والبقاء قائمًا لمدة محددة حسب المنتج.","monitor":"BMD حسب الخطة، وظائف الكلية، الكالسيوم/فيتامين D حسب الحالة.","pearls":"طريقة التناول جزء من فعالية وسلامة الدواء.","tags":["Osteoporosis","Bisphosphonate"]},{"id":"paracetamol","name":"Paracetamol","ar":"باراسيتامول / أسيتامينوفين","system":"N","class":"Non-opioid analgesic / antipyretic","route":"PO / IV / PR","atc":"N02BE01","level":"Beginner","uses":"الألم والحمى في الجرعات المناسبة.","moa":"التأثير المركزي المسكن وخافض الحرارة؛ الآلية الدقيقة متعددة العوامل.","adr":"سمية كبدية خطرة في الجرعات الزائدة أو مع عوامل خطورة معينة.","contra":"الجرعات العالية/مرض الكبد تستلزم تقييمًا حذرًا.","counsel":"انتبه لتكراره داخل مستحضرات البرد والزكام.","monitor":"إجمالي الجرعة اليومية وعوامل خطر الكبد.","pearls":"أكثر خطأ شائع: الجمع بين أكثر من منتج يحتوي paracetamol.","tags":["Pain","Fever"]},{"id":"sertraline","name":"Sertraline","ar":"سيرترالين","system":"N","class":"SSRI","route":"PO","atc":"N06AB06","level":"Intermediate","uses":"الاكتئاب وبعض اضطرابات القلق وغيرها حسب التشخيص.","moa":"يثبط إعادة امتصاص السيروتونين.","adr":"غثيان، اضطراب نوم، آثار جنسية؛ مخاطر نادرة مثل serotonin syndrome.","contra":"ممنوع مع MAOIs والتداخلات المهمة الأخرى.","counsel":"التحسن يحتاج وقتًا؛ لا توقف فجأة دون خطة.","monitor":"الاستجابة، الآثار الجانبية والتداخلات، والمزاج حسب السياق.","pearls":"الفعالية لا تُحكم عادة خلال أول عدة أيام.","tags":["SSRI","Depression"]},{"id":"levetiracetam","name":"Levetiracetam","ar":"ليفيتيراسيتام","system":"N","class":"Antiseizure medicine","route":"PO / IV","atc":"N03AX14","level":"Intermediate","uses":"أنواع متعددة من الصرع حسب التشخيص.","moa":"يرتبط ببروتين SV2A ويعدل النقل المشبكي.","adr":"نعاس، دوخة وتغيرات سلوكية عند بعض المرضى.","contra":"الحذر في قصور الكلية وتعديل الجرعة حسب eGFR.","counsel":"لا يوقف فجأة. انتبه للتغيرات المزاجية والسلوكية.","monitor":"النوبات، السلوك ووظيفة الكلية.","pearls":"تعديل الجرعة في القصور الكلوي مهم.","tags":["Epilepsy","SV2A"]},{"id":"quetiapine","name":"Quetiapine","ar":"كويتيابين","system":"N","class":"Atypical antipsychotic","route":"PO","atc":"N05AH04","level":"Advanced","uses":"اضطرابات نفسية محددة مثل الفصام واضطراب ثنائي القطب وبعض الاستطبابات حسب المنتج.","moa":"تأثيرات متعددة على 5-HT2A وD2 ومستقبلات أخرى.","adr":"نعاس، زيادة وزن، تغيرات استقلابية وانخفاض ضغط وضعي.","contra":"تعتمد على المنتج والحالة؛ الحذر في عوامل الخطر القلبية والاستقلابية.","counsel":"النعاس شائع؛ تجنب القيادة إذا تأثر الوعي.","monitor":"الوزن، السكر/الدهون، الضغط والأعراض.","pearls":"راقب cardiometabolic burden مع الاستعمال المزمن.","tags":["Antipsychotic","Psychiatry"]},{"id":"albendazole","name":"Albendazole","ar":"ألبيندازول","system":"P","class":"Benzimidazole anthelmintic","route":"PO","atc":"P02CA03","level":"Beginner","uses":"بعض الديدان المعوية حسب نوع الطفيلي والجرعة المعتمدة.","moa":"يثبط تكوين الأنابيب الدقيقة في الطفيلي ويؤثر في امتصاص الغلوكوز.","adr":"أعراض هضمية؛ مراقبة الكبد في بعض العلاجات الطويلة.","contra":"تعتمد على الطفيلي والحمل والمدة؛ راجع المنتج.","counsel":"الجرعة تختلف كثيرًا حسب الطفيلي.","monitor":"الاستجابة والوظائف المختبرية عند العلاج المطول.","pearls":"لا توجد جرعة واحدة صالحة لكل الديدان.","tags":["Worms","Anthelmintic"]},{"id":"permethrin","name":"Permethrin 5%","ar":"بيرمثرين 5%","system":"P","class":"Topical pyrethroid","route":"Topical","atc":"P03AC04","level":"Beginner","uses":"علاج الجرب في الاستطبابات المناسبة.","moa":"يعطل قنوات الصوديوم العصبية في الطفيليات.","adr":"حرقان وتهيج موضعيان.","contra":"الحذر بحسب العمر والمنتج والحساسية.","counsel":"تطبيق صحيح على مناطق الجسم المناسبة وعلاج المخالطين/الملابس حسب الإرشادات.","monitor":"الحكة قد تستمر بعد القضاء على الطفيلي؛ قيّم الفشل بعناية.","pearls":"تقنية التطبيق والتعامل مع ة من التسمم وبشروط زمنية وسلامة معينة.","moa":"يمتَص بعض السموم في الجهاز الهضمي ويحد من امتصاصها.","adr":"خطر aspiration، قيء وإمساك.","contra":"تسممات معينة لا يمتصها، أو وجود خطر شفط/انسداد بحسب الحالة.","counsel":"ليس “ترياقًا عامًا” ولا يُعطى منزليًا لكل ابتلاع.","monitor":"مجرى الهواء والحالة السمية وتطور الأعراض.","pearls":"اختيار المريض والزمن والمادة أهم من فكرة “إعطاء الفحم”.","tags":["Toxicology","Poisoning"]},{"id":"pantoprazole","name":"Pantoprazole","ar":"بانتوبرازول","system":"A","route":"PO / IV","uses":"GERD، القرحة، وفرط إفراز الحمض في الاستطبابات المناسبة","moa":"يثبط H+/K+-ATPase في الخلايا الجدارية ويقلل إفراز الحمض.","adr":"صداع، إسهال/إمساك، وآثار مرتبطة بالاستعمال الطويل في بعض المرضى.","contra":"راجع المنتج والحالة السريرية؛ الموانع تختلف حسب الاستطباب.","counsel":"يُؤخذ عادة قبل الطعام؛ لا تُطيل الاستخدام دون مراجعة السبب.","monitor":"الأعراض، الاستجابة، والحاجة إلى الاستمرار.","pearls":"PPI طويل المفعول؛ راقب الحاجة للاستخدام المزمن.","tags":["GERD","PPI"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"Proton pump inhibitor"},{"id":"esomeprazole","name":"Esomeprazole","ar":"إيزوميبرازول","system":"A","route":"PO / IV","uses":"GERD والقرحة وحالات فرط إفراز الحمض المناسبة","moa":"يثبط مضخة البروتون بشكل غير عكوس ويقلل الحموضة.","adr":"صداع واضطرابات هضمية؛ مخاطر الاستعمال الطويل تعتمد على المريض.","contra":"راجع المنتج والحالة السريرية؛ الموانع تختلف حسب الاستطباب.","counsel":"استخدم حسب الوصفة والنشرة الحالية، وانتبه لطريقة الاستعمال والتداخلات.","monitor":"الاستجابة والآثار الجانبية والعوامل الخاصة بالمريض.","pearls":"","tags":["GERD","PPI"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"Proton pump inhibitor"},{"id":"famotidine","name":"Famotidine","ar":"فاموتيدين","system":"A","route":"PO / IV","uses":"GERD والقرحة وأعراض فرط الحمض في الحالات المناسبة","moa":"يحصر مستقبلات H2 في الخلايا وني قد يحدث في ظروف معينة.","contra":"تقييم وظيفة الكلية وحالات الحماض/الجوع الشديد قبل الاستخدام.","counsel":"اهتم بالسوائل وتعلم علامات الحماض الكيتوني حتى مع سكر غير شديد الارتفاع.","monitor":"eGFR، حجم السوائل، السكر وعلامات DKA/التهابات.","pearls":"فوائده القلبية والكلوية ليست مجرد خفض للسكر.","tags":["Diabetes","SGLT2","Heart failure"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"SGLT2 inhibitor"},{"id":"pioglitazone","name":"Pioglitazone","ar":"بيوغليتازون","system":"A","route":"PO","uses":"السكري النوع 2 عند مرضى مختارين","moa":"ينشط PPAR-gamma ويزيد حساسية الإنسولين.","adr":"زيادة وزن، وذمة، خطر تفاقم قصور القلب وكسور.","contra":"غير مناسب في قصور القلب العرضي/الشديد وبعض الحالات؛ راجع المنتج.","counsel":"قد يتأخر أثره أيامًا إلى أسابيع؛ أبلغ عن تورم أو ضيق نفس.","monitor":"الوزن، الوذمة، السكر ووظائف الكبد حسب الخطة.","pearls":"","tags":["Diabetes","TZD"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"Thiazolidinedione"},{"id":"insulin-glargine","name":"Insulin glargine","ar":"إنسولين غلارجين","system":"A","route":"SC","uses":"السكري النوع 1 والنوع 2 حسب النظام العلاجي","moa":"يعوض الإنسولين ويوفر تأثيرًا قاعديًا مستمرًا نسبيًا.","adr":"نقص السكر، زيادة وزن، نقص بوتاسيوم.","contra":"الحذر مع نوبات نقص السكر وتعديل الجرعة الفردي.","counsel":"ثبات وقت الاستخدام بحسب المنتج، وتعلم قياس السكر ومواقع الحقن.","monitor":"سكر الدم/HbA1c ونقص السكر.","pearls":"ليس إنسولين وجبات؛ فرّق بين basal وprandial.","tags":["Insulin","Diabetes"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"Long-acting insulin"},{"id":"insulin-lispro","name":"Insulin lispro","ar":"إنسولين ليسبرو","system":"A","route":"SC / Pump","uses":"التحكم بالسكر حول الوجبات في أنظمة الإنسولين","moa":"نظير سريع للإنسولين يخفض الغلوكوز عبر زيادة دخوله للخلايا وتثبيط إنتاجه الك د والتداخلات.","counsel":"بعض الجرعات تؤخذ مع الطعام حسب الاستطباب.","monitor":"نزف، CBC ووظائف الكلى/الكبد حسب الحاجة.","pearls":"","tags":["Anticoagulant","DOAC"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"Direct factor Xa inhibitor"},{"id":"dabigatran","name":"Dabigatran","ar":"دابيغاتران","system":"B","route":"PO","uses":"AF غير صمامي وعلاج/وقاية VTE في الاستطبابات المناسبة","moa":"يثبط الثرومبين مباشرة ويمنع تحويل الفيبرينوجين إلى فيبرين.","adr":"نزف، عسر هضم.","contra":"وظيفة الكلية مهمة؛ بعض الحالات والصمامات الميكانيكية ليست مناسبة.","counsel":"تجنب فتح/سحق الكبسولة إلا إذا سمح المنتج؛ الحفظ والتعامل مهمان.","monitor":"وظيفة الكلية وعلامات النزف.","pearls":"","tags":["Anticoagulant","DOAC"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"Direct thrombin inhibitor"},{"id":"enoxaparin","name":"Enoxaparin","ar":"إنوكسابارين","system":"B","route":"SC","uses":"وقاية/علاج VTE، وبعض ACS وفق البروتوكول","moa":"يعزز antithrombin ويثبط Xa بدرجة أكبر من IIa.","adr":"نزف، نقص صفائح مناعي مهم (HIT) نادر، فقر دم.","contra":"نزف نشط؛ الحذر في القصور الكلوي الشديد.","counsel":"حقن تحت الجلد وتجنب تدليك موضع الحقن.","monitor":"النزف، الصفائح ووظيفة الكلية في حالات مختارة.","pearls":"","tags":["LMWH","VTE"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"Low-molecular-weight heparin"},{"id":"aspirin","name":"Aspirin","ar":"أسبرين","system":"B","route":"PO","uses":"منع الخثار الشرياني في استطبابات مختارة، ومسكن بجرعات أخرى","moa":"يثبط COX-1 في الصفائح بشكل غير عكوس ويقلل thromboxane A2.","adr":"نزف هضمي، كدمات، تشنج قصبي عند الحساسين.","contra":"نزف نشط وبعض الحساسية/القرحات؛ لا يستخدم للوقاية الأولية لكل شخص تلقائيًا.","counsel":"لا تجمعه مع NSAIDs أو مضادات تخثر دون معرفة التداخل والخطة.","monitor":"علامات النزف وضغط الدم/القرحة حسب المريض.","pe ,"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"Antifibrinolytic"},{"id":"epoetin-alfa","name":"Epoetin alfa","ar":"إيبويتين ألفا","system":"B","route":"SC / IV","uses":"فقر الدم المرتبط بأمراض مزمنة/كلوية وبعض علاجات السرطان وفق الاستطباب","moa":"ينشط مستقبل erythropoietin في نخاع العظم لزيادة إنتاج RBCs.","adr":"ارتفاع ضغط، خثار، زيادة Hb بسرعة.","contra":"هدف Hb فردي؛ خطر الأحداث القلبية/الخثرية مهم ولا يستخدم بلا تقييم.","counsel":"قد يحتاج حديدًا كافيًا ومتابعة متقاربة.","monitor":"Hb، ضغط الدم، الحديد والخطر الخثاري.","pearls":"","tags":["Anemia","Erythropoietin"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"Erythropoiesis-stimulating agent"},{"id":"cyanocobalamin","name":"Cyanocobalamin","ar":"سيانوكوبالامين","system":"B","route":"PO / IM","uses":"علاج نقص فيتامين B12 وبعض أنواع فقر الدم المرتبطة بالنقص","moa":"يعوض B12 الضروري لتكوين DNA ووظائف عصبية/دموية سليمة.","adr":"نادرًا طفح أو تفاعل تحسسي.","contra":"راجع المنتج والحالة السريرية؛ الموانع تختلف حسب الاستطباب.","counsel":"الطريق والمدة يعتمدان على السبب والامتصاص.","monitor":"CBC، B12 وأحيانًا MMA/homocysteine والاستجابة السريرية.","pearls":"","tags":["B12","Anemia"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا حديثًا.","level":"Intermediate","class":"Vitamin B12"},{"id":"folic-acid","name":"Folic acid","ar":"حمض الفوليك","system":"B","route":"PO","uses":"علاج/وقاية نقص الفولات وبعض حالات الحمل وفق الإرشادات","moa":"يعوض الفولات الضروري لتصنيع DNA وكريات الدم.","adr":"عادة جيد التحمل؛ جرعات عالية قد تخفي نقص B12.","contra":"استبعاد نقص B12 قبل علاج فقر الدم طويل الأمد بالفولات وحده.","counsel":"الحمل يحتاج جرعة محددة حسب الخطورة والإرشادات المحلية.","monitor":"CBC والفولات/B12 حسب السبب.","pearls":"","tags":["Folate","Pregnancy"],"dose":"الجرعة تعتمد على الاستطباب والعمر ووظائف الكلية/الكبد والمنتج. راجع مرجعًا مة أخرى بحسب المنطقة والمقاومة.","avoid":"لا تعتمد وصفة ثابتة واحدة لكل البلدان أو بعد فشل سابق.","monitor":"التزام المريض واختبار eradication بعد المدة المناسبة حسب الإرشادات.","source":"راجع إرشادات H. pylori الحديثة."},{"id":"hfref","title":"HFrEF / قصور القلب مع انخفاض EF","system":"C","summary":"العلاج يعتمد على أدوية أساسية متعددة تُستخدم تدريجيًا بحسب التحمل، مع علاج الاحتقان عند الحاجة.","first":"ARNI/ACEI/ARB، beta blocker مناسب، MRA وSGLT2 inhibitor هي محاور رئيسية عند الملاءمة.","alternatives":"Hydralazine/isosorbide وغيرها في سياقات خاصة.","avoid":"بدء أو رفع كل دواء بسرعة دون مراقبة الضغط والكلية والبوتاسيوم.","monitor":"BP، renal function، K، الوزن وأعراض الاحتقان.","source":"راجع إرشادات قصور القلب الحديثة."},{"id":"af","title":"Atrial fibrillation / الرجفان الأذيني","system":"C","summary":"فكر في stroke prevention، ثم rate/rhythm control حسب نوع المريض والأعراض.","first":"DOAC مناسب أو warfarin في حالات مختارة للوقاية الخثرية حسب الخطر؛ rate control غالبًا beta blocker أو CCB مناسب.","alternatives":"Digoxin أو rhythm-control strategies في فئات محددة.","avoid":"لا تستخدم anticoagulation بلا تقييم خطر النزف/السكتة والموانع.","monitor":"HR، ECG، renal function ومؤشرات النزف/الالتزام.","source":"راجع إرشادات AF الحديثة."},{"id":"gout","title":"Gout / النقرس","system":"M","summary":"فرّق بين علاج النوبة وعلاج خفض حمض اليوريك طويل الأمد.","first":"في flare: NSAID أو colchicine أو corticosteroid بحسب المريض؛ للوقاية المزمنة allopurinol خيار شائع.","alternatives":"Febuxostat أو خيارات أخرى عند عدم الملاءمة.","avoid":"لا تبدأ/تعدل urate-lowering therapy بلا خطة للوقاية من flares والمتابعة.","monitor":"Uric acid، renal function والآثار الجانبية.","source":"راجع إرشادات النقرس الحديثة."},{"id":"migraine","title":"Migraine / الشقيقة","system":"N","summary":"حدد المحفزات، التشخيص، شدة النوبات وتكرارها؛ فرّق بين acute وpreventive therapy.","first":"Triptan أو مسكن مناسب للنوبة عند الملاءمة؛ الوقاية تُفكر فيها عند كثرة/شدة النوبات.","alternatives":"Topiramate، بعض eld"><span>أيقونة</span><input data-block="${i}:icon" value="${esc(b.icon||'')}"></label><label class="field"><span>العنوان</span><input data-block="${i}:title" value="${esc(b.title||'')}"></label><label class="field wide"><span>النص</span><textarea data-block="${i}:text" rows="3">${esc(b.text||'')}</textarea></label><label class="field"><span>نص الزر</span><input data-block="${i}:button" value="${esc(b.button||'')}"></label><label class="field"><span>الرابط</span><input data-block="${i}:url" value="${esc(b.url||'')}"></label></div></div>`).join('')||'<div class="empty small">ماكو أقسام إضافية بعد.</div>'}</div></div><div class="sticky-save"><button class="primary" data-action="save-site">حفظ تصميم الموقع</button><button class="secondary" data-action="reset-site">استعادة التصميم الافتراضي</button></div></div><div class="builder-preview"><div class="preview-label">معاينة مباشرة</div><div class="preview-frame" id="builderPreview"></div></div></div>`}

function adminAdvanced(){return `<div class="admin-grid"><div class="cardish"><h3>نسخة احتياطية متقدمة</h3><p class="muted">هذا القسم اختياري. ما تحتاجه للتعديل اليومي موجود في Site Builder وContent Manager.</p><textarea id="editor">${esc(JSON.stringify(state.data,null,2))}</textarea><div class="row-actions"><button class="primary" data-action="save-db">حفظ JSON إلى قاعدة البيانات</button><button class="secondary" data-action="download-json">تصدير JSON</button></div></div><div class="cardish"><h3>مهم</h3><ul><li>التعديل المرئي يُحفظ في جدول site_content.</li><li>الأدوية وبقية المحتوى تبقى في جداولها الخاصة.</li><li>الحذف والإضافة متاحة فقط لحساب Admin.</li></ul></div></div>`}
function renderPreview(){const x=$('#builderPreview');if(!x)return;const s=state.site;x.innerHTML=`<div class="mini-hero"><span>${esc(s.hero.eyebrow)}</span><h2>${esc(s.hero.title)} <em>${esc(s.hero.accent)}</em></h2><p>${esc(s.hero.text)}</p><div><button>${esc(s.hero.primary)}</button><button>${esc(s.hero.secondary)}</button></div></div><div class="mini-grid">${(s.features||[]).map(f=>`<div><b>${esc(f.icon)} ${esc(f.title)}</b><p>${esc(f.text)}</p></div>`).join('')}</div>${(s.customBlocks||[]).map(renderCustomBlock).join('')}`}
function admin(p){if(!state.admin){p.innerHTML=`<div class="section-head"><div><div class="eyebrow">OWNER ACCESS</div><h2>إدارة Pharmacy Plus</h2><p>التعديل الكامل متاح فقط لحساب الإدارة.</p></div></div><div class="admin-login cardish"><div class="notice">سجّل الدخول بحسابك الذي يحمل role = admin في Supabase.</div><form id="loginForm"><label>البريد الإلكتروني<input id="loginEmail" type="email" autocomplete="email" required></label><label>كلمة المرور<input id="loginPass" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">دخول</button></form></div>`;return}p.innerHTML=`<div class="section-head"><div><div class="eyebrow">NO-CODE OWNER CONSOLE</div><h2>لوحة الإدارة المرئية</h2><p>${esc(state.session?.user?.email||'Admin')} · لا تحتاج تفتح كود أو JSON.</p></div><button class="secondary" data-action="logout">تسجيل خروج</button></div><div class="admin-tabs"><button data-admin-tab="builder" class="${state.adminTab==='builder'?'active':''}">🎨 تصميم وواجهة</button><button data-admin-tab="content" class="${state.adminTab==='content'?'active':''}">🗂 إدارة المحتوى</button><button data-admin-tab="advanced" class="${state.adminTab==='advanced'?'active':''}">⚙ متقدم</button></div>${state.adminTab==='builder'?adminBuilder():state.adminTab==='content'?adminContent():adminAdvanced()}`;if(state.adminTab==='builder')renderPreview()}
function render(){applySiteChrome();const ab=$('#adminAccessButton');if(ab)ab.innerHTML=state.admin?'✏️ <span>لوحة التعديل</span>':'🔐 <span>دخول المدير</span>';const p=$('#page');({home,systems,drugs,guides,interactions,cases,quiz,favorites,admin}[state.view]||home)(p);const y=$('#year');if(y)y.textContent=new Date().getFullYear();const v=$('#version');if(v)v.textContent=state.data.meta.version||'';const done=Math.min(100,Math.round((new Set(JSON.parse(localStorage.getItem('pp_seen')||'[]')).size/Math.max(1,state.data.drugs.length))*100));if($('#progressText'))$('#progressText').textContent=done+'%';if($('#progressBar'))$('#progressBar').style.width=done+'%';document.body.classList.toggle('dark',state.dark)}
async function refreshAdmin(){state.admin=false;if(!supa||!state.session)return;try{const {data}=await supa.from('profiles').select('role').eq('id',state.session.user.id).maybeSingle();state.admin=data?.role==='admin'}catch(e){console.warn(e)}}
async function hydrateFromDB(){if(!supa)return;try{const [sys,dr,ca,q,inters,gds,site]=await Promise.all([supa.from('systems').select('*').order('sort_order'),supa.from('drugs').select('*').order('name'),supa.from('cases').select('*'),supa.from('quiz_questions').select('*').order('created_at'),supa.from('interactions').select('*'),supa.from('guides').select('*').order('title'),supa.from('site_content').select('config').eq('id','global').maybeSingle()]);if(dr.data?.length)state.data.drugs=dr.data.map(x=>({...x,tags:x.tags||[]}));if(sys.data?.length)state.data.systems=sys.data.map(x=>({...x,desc:x.description??''}));if(ca.data?.length)state.data.cases=ca.data;if(q.data?.length)state.data.quiz=q.data.map(x=>({q:x.question,a:x.answers,correct:x.correct_index,explain:x.explanation}));if(inters.data)state.data.interactions=inters.data;if(gds.data?.length)state.data.guides=gds.data.map(x=>({id:x.id,title:x.title,system:x.system,summary:x.summary,first:x.first_line,alternatives:x.alternatives,avoid:x.avoid_text,monitor:x.monitor,source:x.source_note}));if(site.data?.config)state.site=mergeDeep(DEFAULT_SITE,site.data.config);render()}catch(e){console.warn('DB read failed',e);render()}}
async function saveSite(){if(!supa||!state.admin)return toast('صلاحية الإدارة غير متاحة');const {error}=await supa.from('site_content').upsert({id:'global',config:state.site,updated_at:new Date().toISOString()},{onConflict:'id'});if(error){console.error(error);toast('فشل حفظ التصميم. شغّل upgrade_visual_editor.sql أولاً.')}else toast('تم حفظ تصميم الموقع ✅')}
async function saveDB(){if(!supa||!state.admin)return toast('صلاحية الإدارة غير متاحة');try{const editor=$('#editor');if(editor){const parsed=JSON.parse(editor.value);state.data=parsed}for(const s of state.data.systems){const {error}=await supa.from('systems').upsert({id:s.id,name:s.name,en:s.en,icon:s.icon,color:s.color,description:s.desc||'',topics:s.topics||[]},{onConflict:'id'});if(error)throw error}for(const d of state.data.drugs){const {error}=await supa.from('drugs').upsert({id:d.id,name:d.name,ar:d.ar,system:d.system,class:d.class||null,route:d.route||null,atc:d.atc||null,level:d.level||null,uses:d.uses||'',moa:d.moa||'',adr:d.adr||'',contra:d.contra||'',counsel:d.counsel||'',monitor:d.monitor||'',pearls:d.pearls||'',dose:d.dose||'',tags:d.tags||[]},{onConflict:'id'});if(error)throw error}await replaceTable('interactions',state.data.interactions||[],x=>x);await replaceTable('cases',state.data.cases||[],c=>({id:c.id,title:c.title,system:c.system,difficulty:c.difficulty,stem:c.stem,options:c.options||[],answer:+c.answer,why:c.why,tags:c.tags||[]}));await replaceTable('guides',state.data.guides||[],g=>({id:g.id,title:g.title,system:g.system,summary:g.summary,first_line:g.first,alternatives:g.alternatives,avoid_text:g.avoid,monitor:g.monitor,source_note:g.source}));await replaceTable('quiz_questions',state.data.quiz||[],q=>({question:q.q,answers:q.a||[],correct_index:+q.correct,explanation:q.explain||''}),'question');toast('تم حفظ المحتوى ✅');await hydrateFromDB()}catch(e){console.error(e);toast('فشل الحفظ؛ راجع الحقول أو الصلاحيات')}}
async function replaceTable(table,arr,mapFn,pk='id'){const del=await supa.from(table).delete().neq(pk,'__never__');if(del.error)throw del.error;for(const x of arr){const {error}=await supa.from(table).insert(mapFn(x));if(error)throw error}}
function setByPath(obj,path,value){const parts=path.split('.');let cur=obj;for(let i=0;i<parts.length-1;i++)cur=cur[parts[i]];cur[parts.at(-1)]=value}
function blankItem(col){const cfg=COLLECTIONS[col],o={};for(const k of cfg.fields){if(['tags','topics','options','a'].includes(k))o[k]=[];else if(['answer','correct'].includes(k))o[k]=0;else o[k]=''}if(o.id!==undefined)o.id='new-'+Date.now();return o}
function syncItemFields(){const arr=state.data[state.collection]||[],item=arr[state.selectedIndex];if(!item)return;document.querySelectorAll('[data-item-field]').forEach(el=>{const k=el.dataset.itemField;let v=el.value;if(Array.isArray(item[k])){try{v=JSON.parse(v)}catch{return}}else if(typeof item[k]==='number')v=Number(v);item[k]=v})}
async function initSupabase(){const cfg=window.PP_CONFIG||{};if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase)return;try{supa=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data:{session}}=await supa.auth.getSession();state.session=session||null;if(session)await refreshAdmin();await hydrateFromDB();supa.auth.onAuthStateChange(async(_e,s)=>{state.session=s||null;if(s)await refreshAdmin();else state.admin=false;await hydrateFromDB()})}catch(e){console.warn('Supabase unavailable',e)}}
document.addEventListener('input',e=>{if(e.target.id==='drugSearch'){state.query=e.target.value;render();setTimeout(()=>{const x=$('#drugSearch');x?.focus();x?.setSelectionRange(x.value.length,x.value.length)},0);return}if(e.target.dataset.site){setByPath(state.site,e.target.dataset.site,e.target.value);applySiteChrome();renderPreview();return}if(e.target.dataset.feature){const [i,k]=e.target.dataset.feature.split(':');state.site.features[+i][k]=e.target.value;renderPreview();return}if(e.target.dataset.block){const [i,k]=e.target.dataset.block.split(':');state.site.customBlocks[+i][k]=e.target.value;renderPreview();return}if(e.target.dataset.itemField){syncItemFields();return}if(e.target.id==='managerSearch'){const q=e.target.value.toLowerCase();document.querySelectorAll('.manager-item').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'':'none')}});
document.addEventListener('change',e=>{if(e.target.id==='systemFilter'){state.system=e.target.value;render()}if(e.target.id==='collectionSelect'){syncItemFields();state.collection=e.target.value;state.selectedIndex=0;render()}if(e.target.dataset.block){const [i,k]=e.target.dataset.block.split(':');state.site.customBlocks[+i][k]=e.target.value;renderPreview()}});
document.addEventListener('click',e=>{const nv=e.target.closest('[data-view]');if(nv){setView(nv.dataset.view);return}const at=e.target.closest('[data-admin-tab]');if(at){state.adminTab=at.dataset.adminTab;render();return}const sel=e.target.closest('[data-select-item]');if(sel){syncItemFields();state.selectedIndex=+sel.dataset.selectItem;render();return}const sg=e.target.closest('[data-system]');if(sg){state.view='drugs';state.system=sg.dataset.system;render();return}const dc=e.target.closest('[data-drug]');if(dc){detail(drug(dc.dataset.drug));return}const fv=e.target.closest('[data-fav]');if(fv){e.stopPropagation();const id=fv.dataset.fav;state.favorites=fav(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];localStorage.setItem('pp_favs',JSON.stringify(state.favorites));render();toast(fav(id)?'تمت الإضافة':'تمت الإزالة');return}const gd=e.target.closest('[data-guide]');if(gd){guideDetail((state.data.guides||[]).find(x=>x.id===gd.dataset.guide));return}const cs=e.target.closest('[data-case]');if(cs){caseDetail(state.data.cases.find(x=>x.id===cs.dataset.case));return}const ca=e.target.closest('[data-case-answer]');if(ca){const idx=+ca.dataset.caseAnswer,correct=+ca.dataset.correct,currentCase=state.data.cases.find(x=>x.id===ca.dataset.caseId);document.querySelectorAll('[data-case-answer]').forEach(b=>b.disabled=true);document.querySelectorAll('[data-case-answer]').forEach((b,i)=>b.classList.add(i===correct?'correct':i===idx?'wrong':''));const ex=$('#caseExplain');ex.hidden=false;ex.innerHTML=idx===correct?`✅ إجابة صحيحة. ${esc(currentCase?.why||'')}`:`❌ الإجابة الصحيحة هي ${String.fromCharCode(65+correct)}. ${esc(currentCase?.why||'')}`;return}const qa=e.target.closest('[data-quiz-answer]');if(qa&&!state.quizAnswered){state.quizAnswered=true;if(+qa.dataset.quizAnswer===state.data.quiz[state.quizIndex].correct)state.quizScore++;render();return}const mf=e.target.closest('[data-move-feature]');if(mf){const i=+mf.dataset.moveFeature,j=i+(+mf.dataset.dir);if(j>=0&&j<state.site.features.length){[state.site.features[i],state.site.features[j]]=[state.site.features[j],state.site.features[i]];render()}return}const df=e.target.closest('[data-delete-feature]');if(df){state.site.features.splice(+df.dataset.deleteFeature,1);render();return}const mb=e.target.closest('[data-move-block]');if(mb){const i=+mb.dataset.moveBlock,j=i+(+mb.dataset.dir);if(j>=0&&j<state.site.customBlocks.length){[state.site.customBlocks[i],state.site.customBlocks[j]]=[state.site.customBlocks[j],state.site.customBlocks[i]];render()}return}const db=e.target.closest('[data-delete-block]');if(db){state.site.customBlocks.splice(+db.dataset.deleteBlock,1);render();return}if(e.target.id==='clearFilters'){state.query='';state.system='';render();return}const a=e.target.closest('[data-action]');if(!a)return;const act=a.dataset.action;if(act==='view-drugs')setView('drugs');else if(act==='view-systems')setView('systems');else if(act==='quiz-next'){state.quizIndex=(state.quizIndex+1)%state.data.quiz.length;state.quizAnswered=false;render()}else if(act==='logout'){supa?.auth.signOut()}else if(act==='save-site')saveSite();else if(act==='reset-site'){state.site=mergeDeep(DEFAULT_SITE,{});render();toast('تمت استعادة التصميم محليًا؛ اضغط حفظ لتثبيته')}else if(act==='add-feature'){state.site.features.push({id:'f'+Date.now(),icon:'✦',title:'مربع جديد',text:'اكتب النص هنا'});render()}else if(act==='add-block'){state.site.customBlocks.push({id:'b'+Date.now(),type:'card',icon:'✦',title:'قسم جديد',text:'اكتب النص هنا',button:'فتح',url:''});render()}else if(act==='add-item'){syncItemFields();state.data[state.collection].push(blankItem(state.collection));state.selectedIndex=state.data[state.collection].length-1;render()}else if(act==='duplicate-item'){syncItemFields();const arr=state.data[state.collection],copy=clone(arr[state.selectedIndex]);if(copy.id!==undefined)copy.id=(copy.id||'item')+'-copy-'+Date.now();arr.splice(state.selectedIndex+1,0,copy);state.selectedIndex++;render()}else if(act==='delete-item'){const arr=state.data[state.collection];if(arr.length&&confirm('متأكد تريد تحذف هذا العنصر؟')){arr.splice(state.selectedIndex,1);state.selectedIndex=Math.max(0,state.selectedIndex-1);render()}}else if(act==='save-content'){syncItemFields();saveDB()}else if(act==='save-db')saveDB();else if(act==='download-json'){const blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='pharmacy-plus-data.json';x.click();URL.revokeObjectURL(u)}});
document.addEventListener('submit',async e=>{if(e.target.id==='loginForm'){e.preventDefault();if(!supa)return toast('Supabase غير مربوط');const {error}=await supa.auth.signInWithPassword({email:$('#loginEmail').value,password:$('#loginPass').value});if(error)toast(error.message);else{await refreshAdmin();render();if(!state.admin)toast('الحساب ليس Admin')}}});
$('#adminAccessButton').onclick=()=>setView('admin');$('#themeToggle').onclick=()=>{state.dark=!state.dark;localStorage.setItem('pp_dark',state.dark?'1':'0');render()};$('#randomDrug').onclick=()=>detail(state.data.drugs[Math.floor(Math.random()*state.data.drugs.length)]);$('#globalSearchBtn').onclick=()=>{setView('drugs');setTimeout(()=>$('#drugSearch')?.focus(),50)};$('#mobileOpen').onclick=()=>$('#sidebar').classList.add('open');$('#mobileClose').onclick=()=>$('#sidebar').classList.remove('open');$('#modalClose').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('open');if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setView('drugs');setTimeout(()=>$('#drugSearch')?.focus(),50)}});
render();initSupabase();
})();
