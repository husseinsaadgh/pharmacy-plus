name: Import Pharmacy Plus package

on:
  push:
    paths:
      - '.import/READY'

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and extract Pharmacy Plus
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .import/chunk-aa.b64 \
            .import/chunk-ab.b64 \
            .import/chunk-ac.b64 \
            .import/chunk-ad.b64 \
            .import/chunk-ae.b64 \
            .import/chunk-af.b64 \
            .import/chunk-ag.b64 \
            .import/chunk-ah.b64 \
            .import/chunk-ai.b64 \
            .import/chunk-aj.b64 \
            .import/chunk-ak.b64 \
            .import/chunk-al.b64 \
            .import/fix-am-01.b64 \
            .import/fix-am-02.b64 \
            .import/chunk-an.b64 \
            .import/chunk-ao.b64 \
            .import/chunk-ap.b64 \
            .import/tail-01.b64 \
            .import/tail-02.b64 \
            .import/tail-03.b64 \
            .import/tail-04.b64 \
            .import/tail-05a.b64 \
            .import/tail-05b.b64 \
            > /tmp/pharmacy-plus.b64
          base64 -d /tmp/pharmacy-plus.b64 > /tmp/pharmacy-plus.zip
          echo "7ffccc7fdc1ea41a311e6f07667c96837e7e78e7a4727afcaf443e8e08ef5304  /tmp/pharmacy-plus.zip" | sha256sum -c -
          rm -rf /tmp/pharmacy-plus
          mkdir -p /tmp/pharmacy-plus
          unzip -q /tmp/pharmacy-plus.zip -d /tmp/pharmacy-plus
          ROOT_DIR="$(find /tmp/pharmacy-plus -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$ROOT_DIR"
          test -f "$ROOT_DIR/index.html"
          test -f "$ROOT_DIR/assets/app.js"
          test -f "$ROOT_DIR/assets/style.css"
          test -f "$ROOT_DIR/assets/data.js"
          test -f "$ROOT_DIR/data/data.json"
          test -f "$ROOT_DIR/db/schema.sql"
          cp -a "$ROOT_DIR"/. .
          rm -rf .import
          git config user.name "Pharmacy Plus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Deploy complete Pharmacy Plus website"
            git push origin HEAD:main
          fi
